<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="850" height="180" role="img" aria-labelledby="title desc"><title id="title">Illustrative delivery lifecycle</title><desc id="desc">Draft proceeds to verified, then published. Each transition requires evidence.</desc><rect width="850" height="180" fill="#191919"/><g font-family="Arial, sans-serif" text-anchor="middle"><g fill="#232323" stroke="#555550"><rect x="30" y="45" width="200" height="75" rx="8"/><rect x="325" y="45" width="200" height="75" rx="8"/><rect x="620" y="45" width="200" height="75" rx="8"/></g><g fill="#deded6" font-size="20"><text x="130" y="89">Draft</text><text x="425" y="89">Verified</text><text x="720" y="89">Published</text></g><g fill="#d97757" font-size="28"><text x="275" y="90">→</text><text x="570" y="90">→</text></g><text x="425" y="158" fill="#aaa99f" font-size="13">Illustrative states; define your real transition criteria.</text></g></svg>
